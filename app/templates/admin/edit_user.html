{% extends 'admin/base_admin.html' %}
{% block title %}Edit User{% endblock %}
{% block content %}
<div class="" style="max-width:600px">
  <h2 class="mb-3">Edit user</h2>
  <form method="POST">{% if csrf_token is defined %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}
    <div class="mb-3"><label class="form-label">Name</label><input name="name" class="form-control" value="{{ user.name }}" required></div>
    <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ user.email }}" required></div>
    <div class="mb-3"><label class="form-label">Phone</label><input name="phone" class="form-control" value="{{ user.phone or '' }}"></div>
    <div class="mb-3">
      <label class="form-label">Role</label>
      <select name="role_id" class="form-select">
        {% for r in roles %}<option value="{{ r.id }}" {{ 'selected' if r.id == user.role_id }}>{{ r.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">New password</label>
      <input type="password" name="password" class="form-control" placeholder="Leave blank to keep the current password">
    </div>
    <div class="form-check mb-3">
      <input type="checkbox" name="is_active" id="is_active" class="form-check-input" {{ 'checked' if user.is_active }}>
      <label for="is_active" class="form-check-label">Active</label>
    </div>
    <button class="btn btn-primary">Save changes</button>
    <a href="{{ url_for('admin.users') }}" class="btn btn-link">Cancel</a>
  </form>
</div>
{% endblock %}
